name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]          # e.g. v1.0.0 -> also publishes a GitHub Release
  pull_request:
  workflow_dispatch:      # manual run from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write     # needed only to create a Release on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Build app (universal: arm64 + x86_64)"
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify
        run: |
          lipo -info "Desktop Icons.app/Contents/MacOS/DesktopIcons"
          codesign --verify --verbose "Desktop Icons.app"
          ls "Desktop Icons.app/Contents/Resources"

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # ditto keeps the .app bundle structure and permissions intact
          ditto -c -k --keepParent "Desktop Icons.app" "DesktopIcons-$VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopIcons-${{ env.VERSION }}
          path: DesktopIcons-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "DesktopIcons-$VERSION.zip" \
            --title "Desktop Icons $GITHUB_REF_NAME" \
            --generate-notes
